services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: a2
      POSTGRES_PASSWORD: a2pass
      POSTGRES_DB: a2db
    volumes:
      - a2_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2 -d a2db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - a2_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://a2:a2pass@db:5432/a2db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  a2_pgdata:
    name: a2_pgdata
  a2_redisdata:
    name: a2_redisdata